<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Hair By Naomie</title>
<desc id="desc">A modern luxury wordmark with a sculptural braided N monogram in black and champagne gold.</desc>
<defs>
 <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2dfb7"/><stop offset=".42" stop-color="#c69a57"/><stop offset=".72" stop-color="#e4c27d"/><stop offset="1" stop-color="#a97835"/></linearGradient>
 <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292324"/><stop offset="1" stop-color="#100f11"/></linearGradient>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<!-- understated light field -->
<ellipse cx="600" cy="338" rx="205" ry="200" fill="#c8a365" opacity=".12" filter="url(#soft)"/>
<!-- sculptural interwoven N / flowing strands -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M442 466 C442 367 442 269 442 201 C442 184 463 178 475 192 L713 475 C725 489 748 480 748 462 L748 217" stroke="url(#champagne)" stroke-width="17"/>
 <path d="M471 475 L471 240 L715 514 L715 237" stroke="url(#ink)" stroke-width="31"/>
 <path d="M499 270 L681 472" stroke="#f8f6f1" stroke-width="5" opacity=".8"/>
 <path d="M499 295 L681 497" stroke="url(#champagne)" stroke-width="4" opacity=".88"/>
 <!-- signature flowing hair strand curls from the N -->
 <path d="M714 513 C771 531 795 492 773 465 C755 444 727 463 740 483 C752 500 779 491 794 472 C817 444 808 413 782 393" stroke="url(#champagne)" stroke-width="9"/>
 <path d="M440 472 C390 492 379 542 410 562 C435 578 461 555 443 536 C427 519 402 535 391 557 C377 586 393 614 420 625" stroke="url(#champagne)" stroke-width="7"/>
</g>
<!-- tiny gold signature dots -->
<circle cx="442" cy="177" r="7" fill="url(#champagne)"/><circle cx="748" cy="194" r="7" fill="url(#champagne)"/>
<!-- wordmark -->
<text x="600" y="673" text-anchor="middle" fill="#201c1d" font-family="Arial,sans-serif" font-size="23" font-weight="400" letter-spacing="12">HAIR BY</text>
<text x="600" y="773" text-anchor="middle" fill="#201c1d" font-family="Georgia,'Times New Roman',serif" font-size="94" font-weight="400" letter-spacing="1">Naomie</text>
<path d="M478 806 Q600 833 722 806" fill="none" stroke="url(#champagne)" stroke-width="3"/>
<text x="600" y="861" text-anchor="middle" fill="#857b70" font-family="Arial,sans-serif" font-size="15" letter-spacing="7">BRAIDING STUDIO</text>
</svg>
